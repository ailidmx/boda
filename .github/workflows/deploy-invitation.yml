name: Deploy wedding invitation

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "web/invitation/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-invitation.yml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "web/invitation/**"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-invitation.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Firebase Hosting destination
        required: true
        type: choice
        default: development
        options:
          - development
          - production

permissions:
  contents: read

concurrency:
  group: firebase-hosting-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/invitation/package-lock.json


      - name: Install dependencies
        working-directory: web/invitation
        run: npm ci

      - name: Write Cloudinary .env from secrets
        working-directory: web/invitation
        run: |
          cat > .env <<'EOF'
          CLOUDINARY_URL=cloudinary://${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}@${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      - name: Build invitation
        working-directory: web/invitation
        run: npm run build

  deploy-development:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/develop') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'development')
    environment:
      name: development
      url: https://boda-500805.web.app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/invitation/package-lock.json

      - name: Install dependencies
        working-directory: web/invitation
        run: npm ci

      - name: Write Cloudinary .env from secrets
        working-directory: web/invitation
        run: |
          cat > .env <<'EOF'
          CLOUDINARY_URL=cloudinary://${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}@${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      - name: Build invitation
        working-directory: web/invitation
        run: npm run build

      - name: Deploy development
        uses: FirebaseExtended/action-hosting-deploy@v0

        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BODA_500805 }}
          projectId: boda-500805
          target: invitation-primary
          channelId: live

  deploy-production:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    environment:
      name: production
      url: https://boda-david-y-ayde.web.app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/invitation/package-lock.json

      - name: Install dependencies
        working-directory: web/invitation
        run: npm ci

      - name: Write Cloudinary .env from secrets
        working-directory: web/invitation
        run: |
          cat > .env <<'EOF'
          CLOUDINARY_URL=cloudinary://${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}@${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
          EOF

      - name: Build invitation
        working-directory: web/invitation
        run: npm run build

      - name: Deploy production
        uses: FirebaseExtended/action-hosting-deploy@v0

        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BODA_500805 }}
          projectId: boda-500805
          target: invitation-named
          channelId: live

      - name: Notify Telegram on production deploy
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Escape Telegram MarkdownV2 special characters in dynamic content.
          esc() { printf '%s' "$1" | sed 's/[\\_*[\]()~`>#+\-=|{}.!]/\\&/g'; }

          # Build a French deploy notification. For PR-triggered deploys we
          # include the PR title + description; for direct pushes we fall back
          # to the commit message.
          if [ -n "$PR_TITLE" ]; then
            DESC="$(esc "$PR_TITLE")"
            if [ -n "$PR_BODY" ]; then
              DESC="$DESC
              $(esc "$PR_BODY")"
            fi
          else
            DESC="$(esc "${COMMIT_MSG:-Déploiement direct}")"
          fi

          STATUS_ICON="✅"
          STATUS_TEXT="réussi"
          if [ "$DEPLOY_STATUS" != "success" ]; then
            STATUS_ICON="❌"
            STATUS_TEXT="échoué"
          fi

          MESSAGE="🚀 *Déploiement production ${STATUS_TEXT}* ${STATUS_ICON}
          *Branche :* $(esc "$REF")
          *Commit :* $(esc "$SHA")
          *Par :* $(esc "$ACTOR")
          *Détails :*
          ${DESC}
          [Voir le run]($(esc "$RUN_URL"))"

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d parse_mode="MarkdownV2" \
            -d disable_web_page_preview="true" \
            > /dev/null
